services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - nrs_mongo:/data/db

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/network_routing_simulator
      FRONTEND_ORIGIN: http://localhost:5173
      NODE_ENV: production
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend

volumes:
  nrs_mongo:
